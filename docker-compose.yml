version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: daolayer-postgres
    environment:
      POSTGRES_DB: usertable_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: